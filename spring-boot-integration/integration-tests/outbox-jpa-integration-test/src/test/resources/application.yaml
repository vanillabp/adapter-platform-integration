spring:
  datasource:
    url: jdbc:h2:mem:outbox-it;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create
dummy-adapter:
  at-least-once-delivery: true
vanillabp:
  adapters:
    test:
      type: dummy
      test: 1
  workflow-modules:
    test-module:
      adapters:
        test:
          resources-location: classpath*:test-module/processes/dummy
      workflows:
        ConflictProcess:
          allow-full-sync-with-bpms: true
        SampleWorkflowService:
          allow-full-sync-with-bpms: true
  outbox:
    poll-interval: PT0.5S
    attempt-frequency: PT0.5S
test-module:
  nothing: there
