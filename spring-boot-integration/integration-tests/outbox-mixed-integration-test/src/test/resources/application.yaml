spring:
  datasource:
    url: jdbc:h2:mem:outbox-mixed-it;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create
dummy-adapter:
  at-least-once-delivery: true
vanillabp:
  adapters:
    test:
      type: dummy
      test: 1
  workflow-modules:
    test-module:
      adapters:
        test:
          resources-location: classpath*:test-module/processes/dummy
      # the test aggregates here are not annotated, so everything of them travels; the tests
      # are about other things, so the workflows allow it (see decision 66)
      workflows:
        HotSampleWorkflowService:
          allow-full-sync-with-bpms: true
        JpaSampleWorkflowService:
          allow-full-sync-with-bpms: true
        MongoSampleWorkflowService:
          allow-full-sync-with-bpms: true
  outbox:
    poll-interval: PT0.5S
    attempt-frequency: PT0.5S
test-module:
  nothing: there
