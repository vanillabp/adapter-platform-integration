# Filled by the Maven build (resource filtering). Read by VanillaBpParts to tell whether
# this extension and the platform integration it runs on belong together. An extension
# built in its own repository fills 'platform.version' from the property naming the
# VanillaBP platform it builds against, here both are the same build.
part.version=${project.version}
part.artifact=${project.groupId}:${project.artifactId}
platform.version=${project.version}
