quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:unknown-workflow;DB_CLOSE_DELAY=-1
vanillabp:
  prioritized-adapters:
    - demo1
    - demo2
  adapters:
    demo1:
      type: dummy
    demo2:
      type: dummy
  workflow-modules:
    test-module:
      prioritized-adapters:
        - demo1
      adapters:
        demo1:
          resources-location: classpath:processes/dummy
        demo2:
          resources-location: classpath:processes/dummy
      workflows:
        NoSuchProcess:
          prioritized-adapters:
            - demo2
