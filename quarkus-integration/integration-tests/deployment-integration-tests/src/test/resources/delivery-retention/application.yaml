quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:delivery-retention;DB_CLOSE_DELAY=-1
vanillabp:
  outbox:
    retention: PT1H
  delivery:
    retention: P30D
  adapters:
    demo1:
      type: dummy
      test: 1
  workflow-modules:
    retention-module:
      adapters:
        demo1:
          resources-location: classpath:processes/retention
