quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:outbox-cache-metrics;DB_CLOSE_DELAY=-1
dummy-adapter:
  two-phase-commit: true
vanillabp:
  adapters:
    test:
      type: dummy
  workflow-modules:
    test-module:
      adapters:
        test:
          resources-location: classpath:test-module/processes/dummy
  workflow-adapter-cache:
    max-entries: 2
    time-to-live: 30m
