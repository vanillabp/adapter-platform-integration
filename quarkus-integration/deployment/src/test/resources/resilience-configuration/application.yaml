vanillabp:
  resilience:
    max-retries: 5
    initial-interval: PT2S
    multiplier: 1.5
    timeout: PT10S
  adapters:
    test:
      type: dummy
      deployment-failure: warn
  workflow-modules:
    test-module:
      resilience:
        max-retries: 9
      adapters:
        test:
          resources-location: classpath:test-module/processes/dummy
