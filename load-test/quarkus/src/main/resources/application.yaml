quarkus:
  banner:
    enabled: false
  datasource:
    db-kind: other
    metrics:
      enabled: true
    jdbc:
      driver: io.vanillabp.loadharness.CountingDriver
      url: "${LOAD_JDBC_URL:jdbc:counting:h2:mem:load;DB_CLOSE_DELAY=-1}"
      max-size: 10
      enable-metrics: true
    username: "${LOAD_JDBC_USER:sa}"
    password: "${LOAD_JDBC_PASSWORD:}"
  log:
    category:
      io.vanillabp:
        level: WARN
dummy-adapter:
  at-least-once-delivery: "${LOAD_AT_LEAST_ONCE:true}"
vanillabp:
  adapters:
    load:
      type: dummy
  workflow-modules:
    load:
      adapters:
        load:
          resources-location: classpath:load/processes
      workflows:
        LoadProcess:
          allow-full-sync-with-bpms: true
          declared-aggregate-values:
            - stepsDone
