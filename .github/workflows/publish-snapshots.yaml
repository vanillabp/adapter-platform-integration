name: Build and publish snapshots
# A pull request builds and tests, a push to main publishes. Both run as the job
# 'publish', which is the check main requires, so a pull request Renovate opens gets a
# result like every other one - it did not while this workflow only listened to pushes
# and ignored renovate/**, and a required check nobody produces waits forever.
#
# Publishing from main alone is the second half of it: there is one snapshot version per
# module, so every branch used to overwrite what main had published in the registry, and
# whoever pushed last decided what the other repositories compiled against.
#
# The snapshots go to the snapshot repository of Maven Central. Anybody can read them there
# without a login, the build of a pull request from a fork included. Writing needs the
# Central Portal token, and only a push to main gets it.
"on":
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # two pushes to main must not publish at the same time, and the later one has to
  # finish rather than be cancelled: it carries the newer artifacts
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # a release bundle with them: "Bundle has content that does NOT have a .pom file". The
      # runner image ships 3.10 now, so this job brings its own 3.9, like the release does.
      # A pull request builds with it too, so it tests with the Maven that main publishes
      # with. Remove this step once a plugin version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
          # the server of the profile 'central-portal' in io.vanillabp:release-parent. The
          # two names are environment variables, and only the step which publishes sets them
          server-id: vanillabp-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      # 'install' and not 'install verify': install runs every phase verify has, so
      # naming both made Maven walk two lifecycles per module. The tests noticed and
      # skipped their second run, the compiler did not, so every javac warning was
      # reported twice - once per compilation - and a reviewer could not tell two
      # occurrences of one problem from two problems. The local repository is still
      # written because the native-build job below resolves from it.
      - name: Build and test
        if: "${{ github.event_name == 'pull_request' }}"
        run: mvn --batch-mode --no-transfer-progress --update-snapshots install
        env:
          CI: false
      # the profile 'central-portal' sends a version ending in -SNAPSHOT straight to the
      # snapshot repository of Maven Central
      - name: Publish snapshot
        if: "${{ github.event_name == 'push' }}"
        run: mvn --batch-mode --no-transfer-progress --update-snapshots deploy -P central-portal
        env:
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}"
          CI: false
      # what a failing test printed is in these reports, and for the modules booting a
      # Quarkus application in the test JVM it is ONLY there: their output is redirected
      # to file because that boot logs into a log context no extension reaches.
      # Surefire prints its last line, which is never the interesting one.
      - name: Upload the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Merge coverage reports
        if: "${{ github.event_name == 'push' }}"
        run: |
          mkdir -p coverage
          cp -r test-coverage-report/spring-boot/report coverage/spring-boot-report
          cp -r test-coverage-report/quarkus/report coverage/quarkus-report
      - name: Upload coverage report files as artifact
        if: "${{ github.event_name == 'push' }}"
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage
  native-build:
    # The one native-image test which cannot be a JUnit test: an application with a
    # relational database and no MongoDB has to link as a native image. GraalVM resolves
    # every method a linked class refers to while it builds, so a reference into an
    # optional extension nobody asked for ends the build - which is what happened before
    # the MongoDB parts moved behind beans the extension registers only where the MongoDB
    # client is present. Its own job: the native build takes minutes and must not delay
    # publishing.
    #
    # Two images, because a profile reaches a binary in two ways and the configuration of a
    # workflow module has to survive both: one image knows no profile and is told about one
    # when it starts, the other was built with the profile and needs no argument at all.
    name: "native-build (${{ matrix.image }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: built-without-a-profile
            built-with: ""
            started-with: "-Dquarkus.profile=tenant"
          - image: built-with-the-tenant-profile
            built-with: "-Dquarkus.profile=tenant"
            started-with: ""
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
      # the deployment modules of both extensions are named explicitly: an extension's
      # augmentation part is not a dependency of the application, so '-am' alone would
      # leave them to be resolved from the snapshot repository - and the build step under
      # test lives in one of them
      - name: Build what the application needs
        run: mvn --batch-mode --no-transfer-progress --update-snapshots -DskipTests
          -pl quarkus-integration/deployment,bpms-double/quarkus/deployment,quarkus-integration/integration-tests/native-image-tests
          -am install
        env:
          CI: false
      # the JVM half of the same assertion: everything the binary has to reproduce works
      # here already, so a regression on the JVM cannot hide behind a green native run
      - name: Boot the application on the JVM
        if: matrix.built-with == ''
        run: |
          java -jar quarkus-integration/integration-tests/native-image-tests/target/quarkus-app/quarkus-run.jar
          java -Dquarkus.profile=tenant -jar quarkus-integration/integration-tests/native-image-tests/target/quarkus-app/quarkus-run.jar
      - name: Build the application as a native image
        run: mvn --batch-mode --no-transfer-progress
          -pl quarkus-integration/integration-tests/native-image-tests
          ${{ matrix.built-with }} -Dnative -Dquarkus.native.container-build=true package
        env:
          CI: false
      # a binary which cannot start is no proof: the application boots, deploys its two
      # workflow modules, reads the configuration they ship out of the image, starts a
      # workflow and reads the aggregate back. Its exit code is the result
      - name: Boot the native image with the tenant profile active
        run: ./quarkus-integration/integration-tests/native-image-tests/target/*-runner ${{ matrix.started-with }}
      # the same binary told nothing: the plain files of both workflow modules have to win
      - name: Boot the native image without a profile
        if: matrix.built-with == ''
        run: ./quarkus-integration/integration-tests/native-image-tests/target/*-runner
  deploy-coverage-report:
    if: "${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}"
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
